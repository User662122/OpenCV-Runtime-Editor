name: BTC Prediction Bot

on:
  workflow_dispatch:          # Manual run (GitHub UI)
  repository_dispatch:        # API / webhook se trigger
  # Optional: schedule: 
  #   - cron: '30 4 * * *'   # har din subah ~10 AM IST

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: \( {{ runner.os }}-pip- \){{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC prediction
        env:                          # ← YE LINE ADD KARNI HAI
          TOKEN: ${{ secrets.TOKEN }} # ← aur yeh secret reference
        run: python binance.py        # ← tumhara script